name: keep-alive

on:
  schedule:
    - cron: "*/10 0-13 * * *"
    - cron: "17 3,15 * * *"
  workflow_dispatch:

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 0-13 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 120 "${{ secrets.RENDER_URL }}/health"

  supabase-qdrant:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3,15 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS --max-time 30 \
            "${{ secrets.SUPABASE_URL }}/rest/v1/guestbook?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
      - name: Ping Qdrant
        run: |
          curl -fsS --max-time 30 \
            "${{ secrets.QDRANT_URL }}/collections" \
            -H "api-key: ${{ secrets.QDRANT_API_KEY }}"
